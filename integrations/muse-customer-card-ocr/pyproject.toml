[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-customer-card-ocr"
version = "0.1.0"
description = "Fail-closed Baidu handwriting OCR client for MUSE customer-card workflows."
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0,<13",
  "requests>=2.31,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
