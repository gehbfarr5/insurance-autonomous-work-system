[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-customer-card-ocr"
version = "0.4.0"
description = "Baidu handwriting OCR adapter and customer-card field extraction for MUSE."
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0,<13",
]

[tool.setuptools.packages.find]
where = ["src"]
