# Candidate Docker Compose configuration for Seoul MCP with Reminders Gateway
# Pinned to accepted candidate image ID; avoids on-site rebuilding.
services:
  carddav:
    image: ${CARDDAV_IMAGE:-sha256:5302c0cd0c4493f770c0f270cee8c5d468f49b74dfb876a4834cbf9ac26162d1}
    restart: unless-stopped
    command: ["/bin/sh", "-c", "umask 077; exec node dist/bin/http.js"]
    mem_limit: 256m
    pids_limit: 128
    env_file:
      - path: ./secrets.env
        format: raw
    environment:
      PORT: '17733'
      TOKEN_STORE_PATH: /app/data/tokens.json.enc
      TRUST_PROXY: 'true'
      # Reminders Readonly Gateway configuration
      MACSERVER_EVENTKIT_ENDPOINT: 'http://172.19.0.1:18765'
      MACSERVER_EVENTKIT_TIMEOUT_MS: '3000'
      ALLOW_REMINDERS_READ_1: 'true'
      ALLOW_REMINDERS_WRITE_1: 'false'
    volumes:
      - ./data:/app/data
    ports:
      - '127.0.0.1:17734:17733'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    security_opt:
      - no-new-privileges:true
